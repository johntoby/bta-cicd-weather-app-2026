name: Success CI/CD Pipeline for BTA weather APP

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Linting
      - name: Run Linting
        run: |
          npm run lint
          if [ $? -ne 0 ]; then echo '::error::Linting failed - aborting pipeline'; exit 1; fi

      # Static Code Analysis (SAST)
      - name: SAST - CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: SAST - Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # Unit Tests
      - name: Run Unit Tests
        run: |
          npm run test:unit
          if [ $? -ne 0 ]; then echo '::error::Unit tests failed - aborting pipeline'; exit 1; fi

      # Integration Tests
      - name: Run Integration Tests
        run: |
          npm run test:integration
          if [ $? -ne 0 ]; then echo '::error::Integration tests failed - aborting pipeline'; exit 1; fi

      # End-to-End Tests
      - name: Run E2E Tests
        run: |
          npm run test:e2e
          if [ $? -ne 0 ]; then echo '::error::E2E tests failed - aborting pipeline'; exit 1; fi

      # Code Coverage (enforce minimum 80% threshold)
      - name: Run Code Coverage
        run: |
          npm run test:coverage -- --coverageThreshold='{"global":{"branches":80,"functions":80,"lines":80,"statements":80}}'
          if [ $? -ne 0 ]; then echo '::error::Code coverage below 80% threshold - aborting pipeline'; exit 1; fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      # DAST - Dynamic Application Security Testing
      - name: Start Application for DAST
        run: node server.js &
        env:
          PORT: 4000

      - name: Wait for App to Start
        run: sleep 5

      - name: DAST - ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:4000'
          fail_action: true
          allow_issue_writing: false

      - name: Security Gate - Verify All Tests Passed
        run: echo '::notice::All security gates passed - proceeding to build and push'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:latest

      # Container Image Security Scan
      - name: Trivy Image Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:latest
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:latest
            docker stop weather-app || true
            docker rm weather-app || true
            docker run -d --name weather-app -p 4000:4000 ${{ secrets.DOCKERHUB_USERNAME }}/weather-app:latest
